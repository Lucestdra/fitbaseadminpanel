name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The Phase 2 exit gate, kept honest. Three mock files remain and two screens may read them;
      # a third screen reaching for one is a screen that looks finished and is not, and nothing
      # else in this pipeline can tell the difference.
      - name: No unexpected mock imports
        run: npm run check:mocks

      # An endpoint the panel cannot reach is a feature that exists only in the contract. Two had
      # already shipped that way before this check existed; nothing else in either repository can
      # see the gap, because it falls between them.
      - name: Every route is called or explained
        run: npm run check:api

      # A compliance rule, not a quality one. CLAUDE.md §11.1/§35 forbid QR-session and
      # WhatsApp Web integrations, and one shipped here for months looking like an unfinished
      # feature — the backend's own architecture tests cannot see this repository, and the panel
      # is where such a flow is actually put in front of a person.
      - name: No forbidden provider-integration patterns
        run: npm run check:integrations

      # The committed types must be what the committed contract generates. Catches two things a
      # typecheck cannot: a hand-edit to src/api/schema.d.ts, and a contract synced from the
      # backend without regenerating — which would leave the app compiling against an API shape
      # that no longer exists.
      #
      # Deliberately not `api:sync`: syncing reaches into the backend and is a decision somebody
      # makes with a diff in front of them, not something CI does on their behalf.
      - name: Generated API types are current
        run: |
          npm run api:generate
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::src/api/schema.d.ts is stale. Run 'npm run api:generate' and commit the result."
            exit 1
          fi
